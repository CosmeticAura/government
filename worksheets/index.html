<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gov essay worksheets</title>
<script>document.documentElement.setAttribute("data-theme","light")</script>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#000;--sec:rgba(60,60,67,.62);--sep:rgba(60,60,67,.22);--fill:rgba(118,118,128,.12);--blue:#007aff;--blueInk:#0a3fae;--blueWash:#eaf2ff;--red:#c4001a;--redWash:#fff0f0;--green:#127a35;--greenWash:#ebf8ef}
*{box-sizing:border-box}html,body{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
main{max-width:820px;margin:0 auto;padding:0 16px 72px}
header{padding:30px 4px 6px}h1{font:700 34px/1.12 -apple-system,"SF Pro Display",system-ui,sans-serif;margin:0;letter-spacing:.005em}
.lede{color:var(--sec);font-size:15px;margin:6px 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);padding:10px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:.5px solid transparent;transition:border-color .2s}
.bar.stuck{border-bottom-color:var(--sep)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(118,118,128,.14);border-radius:10px;padding:2px}
.seg button{position:relative;z-index:1;border:0;background:none;font:600 14px -apple-system,system-ui,sans-serif;color:#000;padding:8px 6px;border-radius:8px;cursor:pointer;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--sec)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);background:#fff;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.steps{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.steps a{flex:none;font-size:14px;font-weight:600;color:var(--blue);background:var(--fill);padding:6px 12px;border-radius:999px;text-decoration:none}
.view{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.seg .thumb{transition:none}}
.prompt{background:#fff;border-radius:14px;padding:16px 18px;margin-top:18px;font-size:19px;font-weight:600;line-height:1.35;border-left:4px solid var(--blue)}
.prompt span{display:block;font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sec);margin:30px 0 8px 16px;scroll-margin-top:120px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{padding:14px 18px;position:relative}.row+.row::before{content:"";position:absolute;left:18px;right:0;top:0;border-top:.5px solid var(--sep)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);margin-bottom:4px}
.words{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}.words li{font-size:15.5px}.words b{color:var(--blueInk)}
.kind{font-size:14px;color:var(--sec);margin-bottom:10px}
.spec{position:relative;height:56px;margin:4px 6px 6px}
.spec .track{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:4px;background:linear-gradient(90deg,#dbe7ff,#007aff)}
.spec .dot{position:absolute;top:13px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;border:3px solid var(--blueInk);display:grid;place-items:center;font:700 11px -apple-system,system-ui,sans-serif;color:var(--blueInk)}
.spec .dot.on{background:var(--blueInk);color:#fff;width:28px;height:28px;margin-left:-14px;top:10px}
.spec .lab{position:absolute;top:40px;font-size:12px;color:var(--sec);transform:translateX(-50%);white-space:nowrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 18px}.opt+.opt{border-top:.5px solid var(--sep)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.pick{background:var(--blueWash)}.opt.pick .n{background:var(--blueInk);color:#fff}.opt .tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--blueInk);background:#fff;border-radius:999px;padding:1px 8px}
.ev{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.ev .h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--sec);padding:10px 18px 4px}
.ev .c{padding:12px 18px;border-top:.5px solid var(--sep);font-size:15.5px}.ev .c b{display:block;margin-bottom:2px}
.ev .w{padding:12px 18px;border-top:.5px solid var(--sep);font-size:15px;color:#1d1d1f;background:#fafafc}
@media (max-width:600px){.ev{grid-template-columns:1fr}.ev .h:nth-child(2){display:none}.ev .w{border-top:0;padding-top:0;background:#fff;color:var(--sec)}.ev .w::before{content:"Supports: ";font-weight:600}}
.blk .txt{font-size:16.5px}
.thesis{background:var(--blueWash)}.thesis .txt{font-weight:600;color:var(--blueInk)}.thesis .lbl{color:var(--blueInk)}
.alt{background:var(--redWash)}.alt .lbl{color:var(--red)}
.t,.e,.a{display:block;margin-top:6px}.t:first-child{margin-top:0}
.pill{display:inline-block;font:800 11px -apple-system,system-ui,sans-serif;letter-spacing:.04em;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px;color:#fff}
.pill.t{background:var(--blue)}.pill.e{background:#636366}.pill.a{background:#1a8f3c}
.a{color:var(--green)}
.copy{border:0;background:var(--fill);color:var(--blue);font:600 13px -apple-system,system-ui,sans-serif;border-radius:999px;padding:5px 11px;cursor:pointer;float:right;margin-top:-2px}
.copy.ok{background:#34c759;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sec);margin:12px 4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style></head><body><main>
<header><p style="margin:0"><a href="../" style="color:#007aff;text-decoration:none;font-weight:600">&lsaquo; Home</a></p><h1>Gov essay worksheets</h1><p class="lede">The class Collaborative Essay Practice sheet, filled in for all three prompts. Pick a prompt, then copy each box onto your sheet.</p>
<div class="legend"><span><i style="background:#0a3fae"></i>Thesis</span><span><i style="background:#007aff"></i>Topic sentence</span><span><i style="background:#636366"></i>Evidence</span><span><i style="background:#1a8f3c"></i>Analysis</span><span><i style="background:#c4001a"></i>Alternative perspective</span></div></header>
<div class="bar" id="bar"><div class="seg" id="seg"><div class="thumb" id="thumb"></div></div>
<nav class="steps"><a href="#s1">Step 1</a><a href="#s2">Step 2</a><a href="#s3">Step 3</a><a href="#s4">Step 4 draft</a></nav></div>
<div id="view"></div>
</main>
<script>
(function(){
var P=[{"n": "1", "title": "Natural rights", "prompt": "To what extent did the Founders create a Constitution that successfully protects citizens' natural rights (life, liberty, and property)?", "rewrite": "How well did the people who wrote the Constitution build a government that actually protects everyone's rights to life, liberty and property?", "words": [["Extent", "how much, so the answer is never just yes or no"], ["Founders", "who"], ["Constitution", "what"], ["Successfully protects", "what you're judging"], ["Natural rights", "rights everyone is born with (John Locke): life, liberty and property"]], "kind": "A \"to what extent\" prompt, so the options are places on a spectrum. We argue between Option 1 and Option 2.", "opts": [["To a great extent", "the Founders built strong protections (separation of powers, checks and balances, the Bill of Rights)"], ["To a limited extent", "they protected natural rights, but only for some people (white men with property)"], ["Very little", "they failed, because the Constitution protected slavery and denied millions their rights"]], "pick": 0, "ev": [["Separation of powers and checks and balances", "Articles I, II and III split power among Congress, the President and the courts (Montesquieu's idea). The President can veto, Congress can override with 2/3 of both houses, the Senate confirms judges.", "Option 1. No branch can grow strong enough to take away people's liberty, which is how a government turns into a tyranny."], ["The Bill of Rights (1791)", "The 1st Amendment protects speech and religion. The 4th bans unreasonable searches and seizures. The 5th says no one can be \"deprived of life, liberty, or property, without due process of law\" and the government can't take private property without paying for it.", "Option 1. The 5th Amendment protects life, liberty and property almost word for word, so this is the strongest proof."], ["Slavery was protected", "The Three Fifths Compromise (Article I) counted enslaved people as 3/5 of a person. The Fugitive Slave Clause (Article IV) forced escaped people to be returned. The slave trade was allowed until 1808.", "Option 3 (or 2). Enslaved people had none of their natural rights protected, so the Constitution failed millions of people."], ["Only some people had a voice", "At first mostly white men who owned property could vote. Women, enslaved people and Native Americans were left out.", "Option 2. Rights were protected well, but only for some citizens."], ["The Constitution was built to grow", "Article V lets it be amended: the 13th (1865) ended slavery, the 14th (1868) says no state can take \"life, liberty, or property, without due process of law\" and guarantees equal protection, the 15th (1870) banned racial voting limits. Marbury v. Madison (1803) gave courts judicial review to enforce rights.", "Option 1, with a limit. The Founders' design let protection reach everyone over time, even though it didn't at first."]], "context": "After the Revolution, Americans had just fought a war against a king they believed had violated their natural rights. The Articles of Confederation that followed created a government too weak to protect anyone, so in 1787 delegates met in Philadelphia to write a new Constitution. Inspired by John Locke, who argued that governments exist to protect life, liberty and property, the Founders had to build a government strong enough to protect those rights but limited enough that it would never threaten them.", "thesis": "The Founders created a Constitution that protected citizens' natural rights to a large extent, because they divided power so no branch could become a tyranny and added a Bill of Rights that directly protects life, liberty and property. However, at first those protections only fully covered some Americans.", "b1": "[T] One major reason the Constitution protects natural rights is that the Founders divided power so no single group could take them away. [E] Following Montesquieu, Articles I, II and III split the government into a legislative, an executive and a judicial branch. Each branch can check the others: the President can veto laws, Congress can override a veto with 2/3 of both houses, and the Senate must confirm judges. [A] This matters because tyranny, the thing the colonists had just fought against, happens when one person or group holds all the power. By making the branches compete, the Founders made it very hard for any leader to take away citizens' liberty, which shows they protected natural rights through the structure itself.", "b2": "[T] Another reason is that the Bill of Rights directly protects life, liberty and property. [E] When the Antifederalists refused to ratify without it, the Founders added the first ten amendments in 1791. The 1st Amendment protects speech and religion, the 4th bans unreasonable searches and seizures, and the 5th says no person can be \"deprived of life, liberty, or property, without due process of law.\" [A] The 5th Amendment uses almost the exact words of Locke's natural rights, which proves the Founders meant to protect them. Writing these rights down gave citizens a guarantee they could use against their own government, so the Constitution protects natural rights in its text, not just in theory.", "alt": "[T] Critics argue that the Founders did not successfully protect natural rights, because those rights were only protected for some Americans. [E] The Constitution protected slavery through the Three Fifths Compromise and the Fugitive Slave Clause, and it allowed the slave trade until 1808. At first, women, enslaved people and Native Americans also could not vote. [A] This is true to an extent, because millions of people were denied their natural rights. However, the Founders also wrote Article V so the Constitution could change. The 13th Amendment (1865) ended slavery, and the 14th (1868) said no state can take anyone's \"life, liberty, or property, without due process of law.\" The system they designed was eventually used to extend natural rights to everyone, which is why their Constitution succeeded to a large extent.", "concl": "The Founders protected life, liberty and property to a large extent by dividing power and writing a Bill of Rights, even though those protections first reached only some Americans. Because they built the Constitution to be amended, the same document that once allowed slavery later became the tool used to protect everyone's natural rights."}, {"n": "2", "title": "How democracy evolved", "prompt": "How has American democracy evolved?", "rewrite": "How has the group of people who get a real voice and real rights in America changed since 1787, and what caused those changes?", "words": [["Democracy", "government where power comes from the people (popular sovereignty)"], ["Evolved", "changed over time; you must show a before and an after"], ["American", "in the U.S., from 1787 to today"]], "kind": "Not a \"to what extent\" prompt, so the options are three ways to describe the change.", "opts": [["It expanded a lot", "from some white men to almost everyone"], ["It expanded, but slowly and unevenly", "real growth, but every step was fought for"], ["It hasn't really changed", "the same groups are still held back"]], "pick": 1, "ev": [["Reconstruction Amendments, the \"Second Founding\"", "13th (1865) ended slavery, 14th (1868) citizenship, equal protection, due process, 15th (1870) no racial voting limits.", "Options 1 and 2: rights reached formerly enslaved people."], ["More voters", "19th Amendment: women vote. 26th: voting age 18.", "Option 1: \"We the People\" grew."], ["Hard amendment process", "Article V: 2/3 of Congress, then 3/4 of the states. Only 27 of 11,000+ proposals passed.", "Option 2: slow, but each change had wide support."], ["Judicial review", "Marbury v. Madison (1803) created it. Mapp v. Ohio (1961): illegal search evidence can't be used. U.S. v. Nixon (1974): the President must follow the law.", "Option 1: courts made rights real."], ["Uneven progress", "13th Amendment still allows slavery \"as a punishment for crime\" (documentary 13th, mass incarceration). Jim Crow blocked the 15th until the Voting Rights Act (1965).", "Option 3, or the limit in Option 2."]], "context": "Democracy means power comes from the people, which the Constitution calls popular sovereignty. In 1787 the Constitution allowed slavery, and mostly only white men who owned property could vote. Since then, \"We the People\" has come to include far more Americans.", "thesis": "American democracy has evolved from a system where only some white men had a voice into a much wider democracy, because amendments extended rights to more people and judicial review made those rights real. That evolution has been slow and uneven.", "b1": "[T] One major reason democracy has grown is the amendment process. [E] The Reconstruction Amendments, the \"Second Founding,\" changed who counts: the 13th ended slavery in 1865, the 14th gave citizenship, equal protection and due process in 1868, and the 15th banned racial limits on voting in 1870. Later, the 19th gave women the vote and the 26th lowered the voting age to 18. Each one needed 2/3 of Congress and 3/4 of the states, which is why only 27 of more than 11,000 proposals ever passed. [A] This shows democracy grew on purpose and with wide support. Because the process is so hard, every amendment that passed proves the country chose to expand who counts.", "b2": "[T] Another reason is that the courts used judicial review to make rights real. [E] Marbury v. Madison (1803) gave courts the power to strike down laws. Mapp v. Ohio (1961) ruled that evidence from an illegal search can't be used, applying the 4th Amendment to the states through the 14th. U.S. v. Nixon (1974) showed that even the President must follow the law. [A] Rights on paper only matter when someone enforces them. Judicial review, which isn't even written in the Constitution, became one of the main ways democracy evolved.", "alt": "[T] Critics argue that American democracy hasn't truly evolved. [E] The 13th Amendment still allows slavery \"as a punishment for crime,\" which the documentary 13th links to mass incarceration, and Jim Crow laws blocked the 15th Amendment for almost 100 years until the Voting Rights Act of 1965. [A] These show the evolution is incomplete, not absent. The same tools, amendments, courts and Congress, are what people used to fight back.", "concl": "American democracy has grown far beyond 1787, but each step had to be fought for, and the work is still not finished."}, {"n": "3", "title": "The 21st century", "prompt": "To what extent is the Constitution serving Americans' needs in the 21st century?", "rewrite": "How well does a document written in 1787 still protect Americans' rights and solve today's problems, like phones, privacy and AI?", "words": [["To what extent", "how much: a spectrum, not yes or no"], ["Constitution", "the 1787 document plus its 27 amendments and how courts read it"], ["Serving needs", "protecting rights and letting government handle new problems"], ["21st century", "today: smartphones, social media, AI"]], "kind": "A \"to what extent\" prompt, so the options are places on a spectrum.", "opts": [["To a great extent", "it adapts to everything"], ["To a large extent, with gaps", "flexible, but privacy depends on courts"], ["Very little", "outdated and too hard to change"]], "pick": 1, "ev": [["Courts apply old rights to new tech", "Riley v. California (2014): warrant to search a phone. Carpenter v. U.S. (2018): warrant for phone location data.", "Option 1: the 4th Amendment covers phones without an amendment."], ["Laws fit to new tech", "Salazar v. Paramount Global (No. 25-459): the Video Privacy Protection Act and tracking pixels. Congress can rewrite a law if it disagrees.", "Options 1 and 2: courts and Congress keep it current."], ["Federalism and AI", "Congress can regulate AI with the Commerce Clause (Article I). States pass their own AI laws as reserved powers (10th Amendment).", "Option 1: the system splits up new problems."], ["Federal vs California (March 2026)", "The Department of Transportation sued California's Air Resources Board, saying the Supremacy Clause overrides its zero emission rules.", "Option 2: the founders' balance still settles fights."], ["Hard to change", "Only 27 amendments; India 100+ since 1950, Mexico 700+ since 1917. Privacy isn't in the text. Presidents gain power through executive orders.", "Option 3, or the gap in Option 2."]], "context": "The Constitution was written in 1787 for about 4 million people and a world without electricity. Today Americans live with smartphones, social media and artificial intelligence. That raises the question of whether a 230 year old document can still protect their rights.", "thesis": "The Constitution serves Americans in the 21st century to a large extent, because courts can apply its broad principles to new technology and federalism with checks and balances lets the country handle problems like AI. However, its slow amendment process leaves modern rights like digital privacy depending on court decisions instead of the text.", "b1": "[T] One major reason it still works is that the Supreme Court interprets the Constitution instead of waiting for amendments. [E] In Riley v. California (2014), the Court ruled police need a warrant to search a phone, and in Carpenter v. U.S. (2018) it required one for phone location data. Salazar v. Paramount Global shows courts fitting the Video Privacy Protection Act to tracking pixels, and Congress can rewrite the law if it disagrees. [A] This shows the founders' broad wording was an advantage. Judicial review and checks and balances let old rights cover new technology without passing an amendment.", "b2": "[T] Another reason is federalism, which splits power between the nation and the states. [E] Congress can regulate AI through the Commerce Clause, while states pass their own AI laws as reserved powers under the 10th Amendment. In March 2026 the Department of Transportation sued California's Air Resources Board, claiming the Supremacy Clause overrides its zero emission rules, while California says it can set stricter standards. [A] This shows the balance between the Supremacy Clause and the 10th Amendment still works. States can experiment while national law keeps the country unified.", "alt": "[T] Critics argue the Constitution can't keep up. [E] Only 27 amendments have passed, while India has made more than 100 since 1950 and Mexico more than 700 since 1917. Privacy isn't written in the text, and presidents keep gaining power through executive orders and emergency powers. [A] That is valid to some extent, but the limits still hold: executive orders can't create laws or change spending, Congress keeps the power of the purse, and U.S. v. Nixon proved no President is above the law. Being hard to change keeps the Constitution stable.", "concl": "The Constitution serves the 21st century to a large extent because its design is flexible, but protecting rights like privacy still depends on courts and Congress keeping up with technology."}];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function tea(s){var parts=s.split(/\[(T|E|A)\]/),out='',lab={T:'Topic',E:'Evidence',A:'Analysis'};for(var i=1;i<parts.length;i+=2){var k=parts[i].toLowerCase();out+='<span class="'+k+'"><span class="pill '+k+'">'+lab[parts[i]]+'</span>'+esc(parts[i+1].trim())+'</span>'}return out}
function plain(s){return s.replace(/\[(T|E|A)\]\s*/g,'').replace(/\*\*/g,'')}
var seg=document.getElementById('seg');
P.forEach(function(p,i){var b=document.createElement('button');b.innerHTML='Prompt '+p.n+'<small>'+esc(p.title)+'</small>';b.onclick=function(){show(i,true)};seg.appendChild(b)});
function block(cls,label,body,raw){return '<div class="row blk '+cls+'"><div class="lbl">'+label+'<button class="copy" data-raw="'+esc(raw).replace(/"/g,'&quot;')+'">Copy</button></div><div class="txt">'+body+'</div></div>'}
function show(i,scroll){
 var p=P[i];document.getElementById('thumb').style.transform='translateX('+(i*100)+'%)';
 seg.querySelectorAll('button').forEach(function(b,k){b.setAttribute('aria-pressed',k===i)});
 var xs=[8,50,92],sp='<div class="spec"><div class="track"></div>'+p.opts.map(function(o,k){var pos=p.n==='1'?[92,50,8][k]:[92,50,8][2-k];return ''}).join('')+'</div>';
 var pick=p.pick;
 var spec='<div class="spec"><div class="track"></div>'+[0,1,2].map(function(k){return '<div class="dot'+(k===pick?' on':'')+'" style="left:'+xs[k]+'%">'+(k+1)+'</div><div class="lab" style="left:'+xs[k]+'%">'+esc(p.opts[k][0])+'</div>'}).join('')+'</div>';
 var h='<div class="view"><div class="prompt"><span>Prompt '+p.n+': '+esc(p.title)+'</span>'+esc(p.prompt)+'</div>';
 h+='<h2 id="s1">Step 1: analyze the prompt</h2><div class="card"><div class="row"><div class="lbl">In your own words</div><div class="txt">'+esc(p.rewrite)+'</div><ul class="words">'+p.words.map(function(w){return '<li><b>'+esc(w[0])+'</b>: '+esc(w[1])+'</li>'}).join('')+'</ul></div></div>';
 h+='<h2 id="s2">Step 2: the three options</h2><div class="card"><div class="row"><div class="kind">'+esc(p.kind)+'</div>'+spec+'</div>'+p.opts.map(function(o,k){return '<div class="opt'+(k===pick?' pick':'')+'"><span class="n">'+(k+1)+'</span><div><b>'+esc(o[0])+'</b>'+(k===pick?'<span class="tag">'+(p.n==='1'?'we argue between 1 and 2':'we argue this')+'</span>':'')+'<br>'+esc(o[1])+'</div></div>'}).join('')+'</div>';
 h+='<h2 id="s3">Step 3: gather evidence</h2><div class="card ev"><div class="h">Evidence</div><div class="h">Which option it supports, and why</div>'+p.ev.map(function(e,k){return '<div class="c"><b>Option '+(k+1)+': '+esc(e[0])+'</b>'+esc(e[1])+'</div><div class="w">'+md(e[2])+'</div>'}).join('')+'</div>';
 h+='<h2 id="s4">Step 4: draft your response</h2><div class="card">'+block('','Context',esc(p.context),p.context)+block('thesis','Thesis',esc(p.thesis),p.thesis)+'</div>';
 h+='<h2>Evidence 1</h2><div class="card">'+block('','Topic, evidence, analysis',tea(p.b1),plain(p.b1))+'</div>';
 h+='<h2>Evidence 2</h2><div class="card">'+block('','Topic, evidence, analysis',tea(p.b2),plain(p.b2))+'</div>';
 h+='<h2>Alternative perspective</h2><div class="card">'+block('alt','Topic, evidence, analysis',tea(p.alt),plain(p.alt))+'</div>';
 h+='<h2>Conclusion</h2><div class="card">'+block('','Not on the class sheet, but the essay needs one',esc(p.concl),p.concl)+'</div></div>';
 var v=document.getElementById('view');v.innerHTML=h;
 v.querySelectorAll('.copy').forEach(function(b){b.onclick=function(){var t=b.getAttribute('data-raw');var done=function(){b.textContent='Copied';b.classList.add('ok');setTimeout(function(){b.textContent='Copy';b.classList.remove('ok')},1400)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){});else done()}});
 try{localStorage.setItem('govws',i)}catch(e){}
 if(scroll){var y=document.getElementById('bar').getBoundingClientRect().top+scrollY;if(scrollY>y)scrollTo({top:y,behavior:'smooth'})}
}
var start=0;try{start=+localStorage.getItem('govws')||0}catch(e){}
show(start>2?0:start,false);
var bar=document.getElementById('bar');addEventListener('scroll',function(){bar.classList.toggle('stuck',bar.getBoundingClientRect().top<=0)});
})();
</script></body></html>
